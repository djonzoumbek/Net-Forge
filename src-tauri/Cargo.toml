[package]
name = "netforge"
version = "0.1.0"
description = "NetForge: SSH, Telnet, serial and SFTP client for network administration"
authors = ["Kamis Djonzoumbé"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "netforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "des"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "rt", "fs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
socket2 = "0.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
russh-sftp = "3.0.1"
tokio-serial = { version = "5.5.0", features = ["libudev"] }
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# No `panic = "abort"`: with unwinding, a panic in one session's task is caught
# by tokio and ends that session only, instead of killing the whole application.
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
